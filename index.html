<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clique aqui</title>

<style>
  :root{
    --bg:#fff7f7;
    --card:#ffffff;
    --text:#171717;
    --muted:#777;
    --accent:#e11d48;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#fffafa,#fff1f2);
    color:var(--text);
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
  }

  .wrap{
    width:min(92vw,420px);
    text-align:center;
  }

  .card{
    background:var(--card);
    border-radius:28px;
    padding:28px;
    box-shadow:0 18px 50px rgba(0,0,0,.08);
  }

  button{
    width:100%;
    border:0;
    border-radius:999px;
    padding:16px 20px;
    font-size:18px;
    font-weight:700;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    transition:.2s transform,.2s opacity;
  }

  button:active{
    transform:scale(.98);
  }

  .stage{
    display:none;
  }

  .stage.active{
    display:block;
    animation:fade .28s ease;
  }

  img{
    width:100%;
    display:block;
    border-radius:22px;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
  }

  .hearts{
    font-size:28px;
    margin-bottom:14px;
    letter-spacing:6px;
  }

  @keyframes fade{
    from{
      opacity:0;
      transform:translateY(6px);
    }

    to{
      opacity:1;
      transform:none;
    }
  }
</style>
</head>

<body>

<main class="wrap">
  <section class="card">

    <div id="s0" class="stage active">
      <button data-next="1">Clique aqui</button>
    </div>

    <div id="s1" class="stage">
      <button data-next="2">Tem certeza?</button>
    </div>

    <div id="s2" class="stage">
      <button data-next="3">Mais um clique</button>
    </div>

    <div id="s3" class="stage">
      <button data-next="4">Quase lá</button>
    </div>

    <div id="s4" class="stage">
      <button data-next="5">Último clique</button>
    </div>

    <div id="s5" class="stage">

      <div class="hearts">❤️ ❤️ ❤️</div>

      <img
        src="surpresa.png"
        alt="Surpresa"
      />

    </div>

  </section>
</main>

<script>
  const stages = [...document.querySelectorAll('.stage')];

  document.addEventListener('click', function(event){

    const botao = event.target.closest('button[data-next]');

    if(!botao) return;

    stages.forEach(function(stage){
      stage.classList.remove('active');
    });

    const proximaTela = document.getElementById(
      's' + botao.dataset.next
    );

    proximaTela.classList.add('active');
  });
</script>

</body>
</html>
